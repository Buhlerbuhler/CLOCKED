
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLOCKED | NUMBER LINE</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#111;background:#f5f5f2}
*{box-sizing:border-box}
body{margin:0}
header{background:#fed500;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}
header strong{font-size:22px;letter-spacing:-1px}
header a{color:inherit;text-decoration:none;font-weight:800}
main{max-width:1400px;margin:auto;padding:22px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800;text-transform:uppercase}
input,select,button{font:inherit;border:2px solid #111;border-radius:5px;padding:10px;background:white}
input{width:95px}
button{font-weight:800;cursor:pointer}
button:hover{background:#f0f0ed}
.primary{background:#fed500}
.panel{background:#fff;border:2px solid #111;border-radius:9px;padding:20px;margin:16px 0}
.line-head{display:flex;align-items:center;justify-content:space-between}
.line-head strong{font-size:15px}
.icon-btn{
  width:33px;height:33px;padding:6px;
  border:0;background:transparent;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  color:#777;cursor:pointer
}
.icon-btn:hover{color:#111;background:#f2f2f2}
.icon-btn svg{width:19px;height:19px}
.canvas{height:330px;position:relative;touch-action:pan-y}
.canvas svg{width:100%;height:100%;display:block}
.hint{color:#555;font-size:13px;margin-top:4px}
.stat{font-size:24px;font-weight:900;margin-left:auto}
.fs-toolbar{display:none}
#numberPanel:fullscreen{
  border:0;border-radius:0;margin:0;
  width:100vw;height:100vh;
  background:#fff;padding:20px;
  display:flex;flex-direction:column
}
#numberPanel:fullscreen .canvas{flex:1;min-height:0;height:auto}
#numberPanel:fullscreen .hint{display:none}
#numberPanel:fullscreen .fs-toolbar{
 display:flex;justify-content:center;align-items:center;
 flex-wrap:wrap;gap:8px;padding:12px 0 5px
}
#numberPanel:fullscreen .fs-toolbar button{padding:10px 16px}
#numberPanel:fullscreen #fullscreenBtn{color:#111}
footer{text-align:center;padding:18px;font-weight:900;font-size:12px;letter-spacing:2px}
@media(max-width:700px){
 main{padding:10px}
 .panel{padding:12px}
 .canvas{height:260px}
 .stat{width:100%}
 header{padding:14px}
 #numberPanel:fullscreen{padding:10px}
 #numberPanel:fullscreen .fs-toolbar button{padding:8px}
}
</style>
</head>
<body>
<header>
<strong>CLOCKED <span style="font-weight:400">/ NUMBER LINE</span></strong>
<a href="/math">☰ MATH TOOLS</a>
</header>
<main>
<div class="panel">
<div class="controls">
<label class="field">Mode
<select id="mode">
<option value="count">Count / Integers</option>
<option value="fraction">Fractions</option>
<option value="groups">Multiply / Divide</option>
</select>
</label>
<label class="field">Minimum
<input type="number" id="min" value="-10" step="any">
</label>
<label class="field">Maximum
<input type="number" id="max" value="10" step="any">
</label>
<label class="field">Major interval
<select id="tick">
<option value="1">1</option>
<option value="2">2</option>
<option value="5">5</option>
<option value="10">10</option>
</select>
</label>
<label class="field">Subdivisions
<input type="number" id="segments" value="1" min="1" max="100" step="1">
</label>
<label class="field">Labels
<select id="labels">
<option value="whole">Whole numbers</option>
<option value="all">Every tick</option>
<option value="decimal">Decimals</option>
<option value="none">Hide labels</option>
</select>
</label>
<button id="resetView">Reset view</button>
</div>
</div>

<div class="panel" id="numberPanel">
<div class="line-head">
<strong>NUMBER LINE</strong>
<button id="fullscreenBtn" class="icon-btn"
 aria-label="Enter fullscreen" title="Fullscreen">
<svg id="expandIcon" viewBox="0 0 24 24" fill="none"
 stroke="currentColor" stroke-width="2" stroke-linecap="round"
 stroke-linejoin="round">
<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/>
</svg>
</button>
</div>
<div class="canvas">
<svg id="line" viewBox="0 0 1200 320"
 preserveAspectRatio="xMidYMid meet"
 role="img" aria-label="Interactive number line"></svg>
</div>
<div class="hint">
Click the number line to choose a starting point.
Adjust subdivisions to display fractions such as sixths or sevenths.
</div>
<div class="fs-toolbar">
<button id="fsBack">← Jump</button>
<button id="fsForward" class="primary">Jump →</button>
<button id="fsUndo">Undo</button>
<button id="fsClear">Clear</button>
<button id="fsZoomIn">Zoom +</button>
<button id="fsZoomOut">Zoom −</button>
<strong id="fsResult" style="margin-left:14px;font-size:20px">0</strong>
</div>
</div>

<div class="panel">
<div class="controls">
<label class="field">Starting point
<input type="number" id="start" value="0" step="any">
</label>
<label class="field">Jump size
<input type="number" id="step" value="1" step="any">
</label>
<label class="field">Number of jumps
<input type="number" id="jumps" value="1" min="1" max="100">
</label>
<button class="primary" id="forward">Jump →</button>
<button id="backward">← Jump</button>
<button id="all">Show all jumps</button>
<button id="undo">Undo</button>
<button id="clear">Clear</button>
<button id="zoomIn">Zoom +</button>
<button id="zoomOut">Zoom −</button>
<div class="stat" id="result">0</div>
</div>
</div>
</main>
<footer>CLOCKED | MATH TOOLS</footer>

<script>
const $=id=>document.getElementById(id);
const svg=$('line');
const NS='http://www.w3.org/2000/svg';
let path=[],current=0;

function el(tag,attrs={},text){
 const n=document.createElementNS(NS,tag);
 Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));
 if(text!==undefined)n.textContent=text;
 svg.append(n);
 return n;
}
const val=id=>Number($(id).value);
const subdivisions=()=>Math.max(1,Math.min(100,Math.floor(val('segments')||1)));
const interval=()=>val('tick');
const minorStep=()=>interval()/subdivisions();

function gcd(a,b){
 a=Math.abs(a);b=Math.abs(b);
 while(b){let t=b;b=a%b;a=t;}
 return a||1;
}
function fractionString(n){
 if(Math.abs(n)<1e-8)return '0';
 const den=subdivisions();
 const base=interval();
 const num=Math.round(n*den/base);
 const numerator=num*base;
 if(!Number.isInteger(numerator))
  return String(Number(n.toFixed(5)));
 const divisor=gcd(numerator,den);
 const a=numerator/divisor,b=den/divisor;
 return b===1?String(a):a+'/'+b;
}
function fmt(n){
 if(Math.abs(n)<1e-8)n=0;
 if($('mode').value==='fraction' ||
    ($('labels').value==='all'&&subdivisions()>1)){
  const rounded=Math.round(n/minorStep())*minorStep();
  if(Math.abs(n-rounded)<1e-6)
   return fractionString(n);
 }
 return String(Number(n.toFixed(5)));
}
function render(){
 const lo=val('min'),hi=val('max');
 const major=interval(),segments=subdivisions();
 const tick=minorStep();
 if(!(hi>lo)||!(tick>0)||!Number.isFinite(hi-lo))return;
 svg.replaceChildren();

 const x=n=>70+(n-lo)/(hi-lo)*1060;
 const y=155;
 el('line',{x1:50,y1:y,x2:1150,y2:y,
  stroke:'#111','stroke-width':5});
 el('path',{d:'M50 155 L65 146 L65 164 Z M1150 155 L1135 146 L1135 164 Z',fill:'#111'});

 const total=(hi-lo)/tick;
 // Avoid excessive ticks on very wide ranges.
 const stride=Math.max(1,Math.ceil(total/500));
 const first=Math.ceil((lo-1e-9)/tick);

 const labels=$('labels').value;
 const every=labels==='all'||labels==='decimal';
 const labelWidth=(hi-lo)*34/1060;
 let lastLabel=-Infinity;

 for(let i=first;i*tick<=hi+1e-8;i+=stride){
  const n=i*tick;
  if(n<lo-1e-8)continue;
  const isMajor=i%segments===0;
  const isWhole=Math.abs(n-Math.round(n))<1e-7;
  const boldTick=isMajor||isWhole;
  el('line',{
   x1:x(n),y1:y-(boldTick?17:10),
   x2:x(n),y2:y+(boldTick?17:10),
   stroke:'#111','stroke-width':boldTick?3:1.5
  });

  const show=every||(labels==='whole'&&isWhole);
  // Space labels sufficiently to avoid overlaps.
  const textValue=labels==='decimal'
   ?String(Number(n.toFixed(5))):fmt(n);
  const minSpace=(textValue.length*9+14)/1060*(hi-lo);
  if(show && n-lastLabel>=Math.max(labelWidth,minSpace)){
   el('text',{
    x:x(n),y:195,'text-anchor':'middle',
    'font-size':isWhole?19:15,
    'font-weight':isWhole?800:500
   },textValue);
   lastLabel=n;
  }
 }

 const visiblePaths=path.slice(-100);
 visiblePaths.forEach(([a,b],i)=>{
  const xa=x(a),xb=x(b);
  if(Math.max(xa,xb)<45||Math.min(xa,xb)>1155)return;
  const offset=38+(i%4)*25;
  const color=i%2?'#008ac5':'#ef6a21';
  el('path',{
   d:`M${xa} ${y-5} Q${(xa+xb)/2} ${y-offset-40} ${xb} ${y-5}`,
   fill:'none',stroke:color,'stroke-width':4,
   'stroke-linecap':'round'
  });
  if(Math.abs(xb-xa)>2)
   el('path',{
    d:`M${xb-7*Math.sign(b-a)} ${y-12} L${xb} ${y-5} L${xb-10*Math.sign(b-a)} ${y-1}`,
    fill:'none',stroke:color,'stroke-width':3
   });
 });

 if(current>=lo&&current<=hi){
  el('circle',{cx:x(current),cy:y,r:10,
   fill:'#fed500',stroke:'#111','stroke-width':3});
  el('text',{x:x(current),y:240,
   'text-anchor':'middle','font-size':27,
   'font-weight':900},fmt(current));
 }
 $('result').textContent='Position: '+fmt(current);
 $('fsResult').textContent='Position: '+fmt(current);
}

function setStart(){
 current=val('start');
 path=[];
 render();
}
function jump(direction,n=1){
 const amount=val('step')*direction;
 if(!Number.isFinite(amount)||amount===0)return;
 for(let i=0;i<n;i++){
  const next=Number((current+amount).toFixed(10));
  path.push([current,next]);
  current=next;
 }
 render();
}
function undo(){
 if(path.length){
  current=path.pop()[0];
  render();
 }
}
function zoom(f){
 const lo=val('min'),hi=val('max');
 const mid=(lo+hi)/2,half=(hi-lo)*f/2;
 $('min').value=Number((mid-half).toFixed(8));
 $('max').value=Number((mid+half).toFixed(8));
 render();
}

svg.addEventListener('click',e=>{
 const matrix=svg.getScreenCTM();
 if(!matrix)return;
 const pt=svg.createSVGPoint();
 pt.x=e.clientX;pt.y=e.clientY;
 const p=pt.matrixTransform(matrix.inverse());
 if(p.x<65||p.x>1135)return;
 const lo=val('min'),hi=val('max');
 const t=minorStep();
 const raw=lo+(p.x-70)/1060*(hi-lo);
 current=Number((Math.round(raw/t)*t).toFixed(10));
 $('start').value=current;
 path=[];
 render();
});

$('forward').onclick=()=>jump(1);
$('backward').onclick=()=>jump(-1);
$('all').onclick=()=>{
 setStart();
 jump(1,Math.min(100,Math.max(1,Math.floor(val('jumps')||1))));
};
$('undo').onclick=undo;
$('clear').onclick=setStart;
$('start').onchange=setStart;
$('zoomIn').onclick=()=>zoom(.5);
$('zoomOut').onclick=()=>zoom(2);

$('fsForward').onclick=()=>jump(1);
$('fsBack').onclick=()=>jump(-1);
$('fsUndo').onclick=undo;
$('fsClear').onclick=setStart;
$('fsZoomIn').onclick=()=>zoom(.5);
$('fsZoomOut').onclick=()=>zoom(2);

['min','max','tick','segments','labels','mode'].forEach(id=>{
 $(id).onchange=()=>{
  if(id==='mode'){
   if($('mode').value==='fraction'){
    $('min').value=-2;
    $('max').value=2;
    $('tick').value=1;
    $('segments').value=4;
    $('labels').value='all';
    $('step').value=.25;
   }else if($('mode').value==='groups'){
    $('min').value=-20;
    $('max').value=20;
    $('tick').value=1;
    $('segments').value=1;
    $('labels').value='whole';
    $('step').value=3;
   }else{
    $('min').value=-10;
    $('max').value=10;
    $('tick').value=1;
    $('segments').value=1;
    $('labels').value='whole';
    $('step').value=1;
   }
   setStart();
  }
  if(id==='segments'){
   $('segments').value=subdivisions();
   if($('mode').value==='fraction')
    $('step').value=Number(minorStep().toFixed(10));
  }
  render();
 };
});
$('resetView').onclick=()=>{
 $('min').value=-10;
 $('max').value=10;
 $('tick').value=1;
 $('segments').value=1;
 render();
};

// Fullscreen controls
const panel=$('numberPanel');
const fsBtn=$('fullscreenBtn');

fsBtn.onclick=async()=>{
 if(document.fullscreenElement){
  await document.exitFullscreen();
 }else if(panel.requestFullscreen){
  try{
   await panel.requestFullscreen();
  }catch(err){
   console.warn('Fullscreen is not supported here.',err);
  }
 }
};
document.addEventListener('fullscreenchange',()=>{
 const isFull=document.fullscreenElement===panel;
 fsBtn.setAttribute('aria-label',
  isFull?'Exit fullscreen':'Enter fullscreen');
 fsBtn.title=isFull?'Exit fullscreen':'Fullscreen';
 $('expandIcon').innerHTML=isFull
  ?'<path d="M8 3v5H3M16 3v5h5M3 16h5v5M21 16h-5v5"/>'
  :'<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/>';
});
render();
</script>
</body>
</html>
