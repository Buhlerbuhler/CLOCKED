</style>
</head>

<body>

<header class="topbar">
  <div class="brand">CLOCKED / INTEGER LINE</div>

  <div class="top-controls">
    <select id="rangeSelect" class="control" aria-label="Number line range">
      <option value="10">−10 TO 10</option>
      <option value="20">−20 TO 20</option>
      <option value="100">−100 TO 100</option>
    </select>

    <button id="randomBtn" class="control" type="button">
      RANDOM
    </button>
  </div>
</header>

<main>

  <section class="equation-area">

    <input
      id="equationInput"
      type="text"
      autocomplete="off"
      spellcheck="false"
      placeholder="8 − (−1)"
      aria-label="Integer equation"
    >

    <button id="showBtn" class="main-button" type="button">
      SHOW
    </button>

  </section>

  <section class="learning-panel" aria-live="polite">
    <div id="learningMain"></div>
    <div id="learningSub"></div>
  </section>

  <section>

    <div class="line-wrap" id="lineWrap">

      <div class="line" id="numberLine">

        <div class="ticks" id="ticks"></div>

        <div id="movePath">
          <div id="moveLabel"></div>
        </div>

        <div id="marker"></div>

        <div class="endcap left"></div>
        <div class="endcap right"></div>

      </div>

    </div>

    <div id="result" aria-live="polite"></div>
    <div id="message" aria-live="polite"></div>

    <div class="bottom-controls">
      <button id="stepBtn" class="small-button" type="button">
        STEP
      </button>

      <button id="resetBtn" class="small-button" type="button">
        RESET
      </button>
    </div>

  </section>

</main>

<script>
(() => {

  const input = document.getElementById("equationInput");
  const showBtn = document.getElementById("showBtn");
  const stepBtn = document.getElementById("stepBtn");
  const resetBtn = document.getElementById("resetBtn");
  const randomBtn = document.getElementById("randomBtn");
  const rangeSelect = document.getElementById("rangeSelect");

  const ticks = document.getElementById("ticks");
  const marker = document.getElementById("marker");
  const movePath = document.getElementById("movePath");
  const moveLabel = document.getElementById("moveLabel");
  const result = document.getElementById("result");
  const message = document.getElementById("message");
  const learningMain = document.getElementById("learningMain");
  const learningSub = document.getElementById("learningSub");

  let range = 10;
  let currentProblem = null;
  let stepStage = 0;
  let running = false;
  let timers = [];


  function minus(n) {
    return String(n).replace("-", "−");
  }


  function formatSecondNumber(n) {
    return n < 0
      ? "(" + minus(n) + ")"
      : minus(n);
  }


  function formatEquation(problem, includeAnswer = false) {

    let text =
      minus(problem.start) +
      " " +
      problem.operator +
      " " +
      formatSecondNumber(problem.second);

    if (includeAnswer) {
      text += " = " + minus(problem.answer);
    }

    return text;
  }


  function clearTimers() {
    timers.forEach(id => clearTimeout(id));
    timers = [];
  }


  function later(fn, ms) {
    const id = setTimeout(fn, ms);
    timers.push(id);
  }


  function buildLine() {

    range = Number(rangeSelect.value);
    ticks.innerHTML = "";

    let labelInterval = 1;

    if (range === 20) {
      labelInterval = 2;
    }

    if (range === 100) {
      labelInterval = 10;
    }

    for (let n = -range; n <= range; n++) {

      const pct = ((n + range) / (range * 2)) * 100;

      const tick = document.createElement("div");
      tick.className = "tick";

      if (n === 0) {
        tick.classList.add("zero");
      }
      else if (n % labelInterval === 0) {
        tick.classList.add("major");
      }

      tick.style.left = pct + "%";

      if (n === 0 || n % labelInterval === 0) {

        const label = document.createElement("div");
        label.className = "tick-label";

        if (n === 0) {
          label.classList.add("zero-label");
        }

        label.textContent = minus(n);
        tick.appendChild(label);
      }

      ticks.appendChild(tick);
    }

    resetVisuals();
  }


  function parseEquation(raw) {

    const value = raw
      .replace(/−/g, "-")
      .replace(/\s+/g, "");

    const match = value.match(
      /^(-?\d+)([+-])\(?(-?\d+)\)?$/
    );

    if (!match) {
      return null;
    }

    const start = Number(match[1]);
    const operator = match[2];
    const second = Number(match[3]);

    let movement;

    if (operator === "+") {
      movement = second;
    }
    else {
      movement = -second;
    }

    const answer = start + movement;

    return {
      start,
      operator,
      second,
      movement,
      answer
    };
  }


  function getPosition(value) {
    return ((value + range) / (range * 2)) * 100;
  }


  function isVisible(problem) {
    return (
      problem.start >= -range &&
      problem.start <= range &&
      problem.answer >= -range &&
      problem.answer <= range
    );
  }


  function resetVisuals() {

    clearTimers();

    running = false;
    currentProblem = null;
    stepStage = 0;

    marker.classList.remove("visible");

    movePath.className = "";
    movePath.style.left = "";
    movePath.style.width = "";

    moveLabel.textContent = "";

    result.classList.remove("visible");
    result.textContent = "";

    message.textContent = "";

    learningMain.innerHTML = "";
    learningSub.textContent = "";

    stepBtn.classList.remove("active");
  }


  function loadProblem() {

    resetVisuals();

    const parsed = parseEquation(input.value);

    if (!parsed) {
      message.textContent = "TRY SOMETHING LIKE 8 − (−1)";
      return false;
    }

    if (!isVisible(parsed)) {
      message.textContent =
        "THAT ANSWER FALLS OUTSIDE THIS NUMBER LINE";
      return false;
    }

    currentProblem = parsed;

    return true;
  }


  function showRead() {

    if (!currentProblem) return;

    learningMain.innerHTML =
      '<span class="rewrite">' +
      formatEquation(currentProblem) +
      '</span>';

    learningSub.textContent = "READ THE EXPRESSION";
  }


  function showNegativeMeaning() {

    if (!currentProblem) return;

    learningMain.textContent =
      minus(currentProblem.second) +
      " MEANS " +
      Math.abs(currentProblem.second) +
      " STEP" +
      (Math.abs(currentProblem.second) === 1 ? "" : "S") +
      " LEFT";

    learningSub.textContent =
      "THE SIGN ON THE NUMBER TELLS ITS DIRECTION";
  }


  function showReverseMeaning() {

    if (!currentProblem) return;

    learningMain.textContent = "SUBTRACT = REVERSE";

    learningSub.textContent =
      "REVERSE LEFT → MOVE RIGHT";
  }


  function showRewrite() {

    if (!currentProblem) return;

    const rewrittenOperator =
      currentProblem.movement >= 0 ? "+" : "−";

    const rewrittenAmount =
      Math.abs(currentProblem.movement);

    learningMain.innerHTML =
      '<span class="rewrite">' +
      minus(currentProblem.start) +
      " " +
      rewrittenOperator +
      " " +
      rewrittenAmount +
      '</span>';

    learningSub.textContent =
      "NOW THE MOVEMENT IS CLEAR";
  }


  function showStart() {

    if (!currentProblem) return;

    const startPct = getPosition(currentProblem.start);

    marker.style.left = startPct + "%";
    marker.classList.add("visible");

    message.textContent =
      "START AT " + minus(currentProblem.start);
  }


  function showMovement() {

    if (!currentProblem) return;

    const startPct = getPosition(currentProblem.start);
    const endPct = getPosition(currentProblem.answer);

    const left = Math.min(startPct, endPct);
    const width = Math.abs(endPct - startPct);

    movePath.style.left = left + "%";
    movePath.style.width = width + "%";

    movePath.className =
      currentProblem.movement >= 0
        ? "visible right"
        : "visible left";

    const direction =
      currentProblem.movement >= 0
        ? "RIGHT"
        : "LEFT";

    moveLabel.textContent =
      Math.abs(currentProblem.movement) +
      " " +
      direction;

    message.textContent =
      "MOVE " +
      Math.abs(currentProblem.movement) +
      " " +
      direction;
  }


  function showAnswer() {

    if (!currentProblem) return;

    const answerPct = getPosition(currentProblem.answer);

    marker.style.left = answerPct + "%";

    result.textContent =
      formatEquation(currentProblem, true);

    result.classList.add("visible");

    learningMain.textContent = "";
    learningSub.textContent = "";

    message.textContent =
      "LAND ON " + minus(currentProblem.answer);
  }


  function runFullAnimation() {

    if (!loadProblem()) return;

    running = true;

    showRead();

    const needsExtraTeaching =
      currentProblem.second < 0;

    if (needsExtraTeaching) {

      later(() => {
        showNegativeMeaning();
      }, 900);

      later(() => {
        showReverseMeaning();
      }, 2000);

      later(() => {
        showRewrite();
      }, 3100);

      later(() => {
        showStart();
      }, 4100);

      later(() => {
        showMovement();
      }, 4800);

      later(() => {
        showAnswer();
        running = false;
      }, 5800);

    } else {

      later(() => {
        showStart();
      }, 700);

      later(() => {
        showMovement();
      }, 1400);

      later(() => {
        showAnswer();
        running = false;
      }, 2400);
    }
  }


  function getStepSequence(problem) {

    const steps = [showRead];

    if (problem.second < 0) {
      steps.push(
        showNegativeMeaning,
        showReverseMeaning,
        showRewrite
      );
    }

    steps.push(
      showStart,
      showMovement,
      showAnswer
    );

    return steps;
  }


  function runStep() {

    if (running) return;

    if (!currentProblem) {

      if (!loadProblem()) return;

      stepStage = 0;
      stepBtn.classList.add("active");
    }

    const sequence = getStepSequence(currentProblem);

    if (stepStage >= sequence.length) {

      if (!loadProblem()) return;

      stepBtn.classList.add("active");
      stepStage = 0;
    }

    sequence[stepStage]();
    stepStage++;
  }


  function randomProblem() {

    resetVisuals();

    let start;
    let movement;
    let answer;

    const maxMove =
      range === 100 ? 20 :
      range === 20 ? 12 :
      9;

    do {

      start =
        Math.floor(
          Math.random() * (range * 2 + 1)
        ) - range;

      movement =
        Math.floor(
          Math.random() * (maxMove * 2 + 1)
        ) - maxMove;

      answer = start + movement;

    } while (
      movement === 0 ||
      answer < -range ||
      answer > range
    );

    const useAddition = Math.random() > .5;

    let operator;
    let second;

    if (useAddition) {
      operator = "+";
      second = movement;
    }
    else {
      operator = "−";
      second = -movement;
    }

    input.value =
      minus(start) +
      " " +
      operator +
      " " +
      formatSecondNumber(second);

    input.focus();
  }


  showBtn.addEventListener("click", runFullAnimation);

  stepBtn.addEventListener("click", runStep);

  resetBtn.addEventListener("click", () => {
    resetVisuals();
    input.value = "";
    input.focus();
  });

  randomBtn.addEventListener("click", randomProblem);

  rangeSelect.addEventListener("change", buildLine);

  input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      runFullAnimation();
    }
  });

  buildLine();

})();
</script>

</body>
</html>
