const loaded=new Set();
const tabs=[...document.querySelectorAll('.tool-tab')];
function activate(tool){
 if(!embeddedTools[tool])return;
 tabs.forEach(b=>{const active=b.dataset.tool===tool;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
 document.querySelectorAll('.math-frame').forEach(f=>f.classList.toggle('active',f.id==='frame-'+tool));
 if(!loaded.has(tool)){
  const frame=document.getElementById('frame-'+tool);
  const bytes=Uint8Array.from(atob(embeddedTools[tool]),c=>c.charCodeAt(0));
  frame.srcdoc=new TextDecoder('utf-8').decode(bytes);
  loaded.add(tool);
 }
 const url=new URL(window.location.href);url.hash=tool==='balanced'?'':tool;
 history.replaceState(null,'',url);
 closeMenu();
}
tabs.forEach(b=>b.addEventListener('click',()=>activate(b.dataset.tool)));
const menuButton=document.getElementById('theme-button'),menu=document.getElementById('theme-panel');
function closeMenu(){menu.classList.add('hidden');menuButton.setAttribute('aria-expanded','false')}
menuButton.addEventListener('click',()=>{const open=menu.classList.contains('hidden');menu.classList.toggle('hidden',!open);menuButton.setAttribute('aria-expanded',String(open))});
document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!menuButton.contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
const themeInput=document.getElementById('theme-color');
function applyTheme(color){if(!/^#[0-9a-f]{6}$/i.test(color))return;const n=parseInt(color.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;const fg=(r*299+g*587+b*114)/1000>150?'#000000':'#ffffff';document.documentElement.style.setProperty('--bg',color);document.documentElement.style.setProperty('--text',fg);document.documentElement.style.setProperty('--muted',fg==='#ffffff'?'rgba(255,255,255,.6)':'rgba(0,0,0,.6)');themeInput.value=color;try{localStorage.setItem('clocked_math_theme',color)}catch{}}
themeInput.addEventListener('input',()=>applyTheme(themeInput.value));
document.getElementById('theme-reset').addEventListener('click',()=>applyTheme('#7ae0ff'));
let saved=null;try{saved=localStorage.getItem('clocked_math_theme')}catch{}applyTheme(saved||'#7ae0ff');
activate(['balanced','integers','fractions'].includes(location.hash.slice(1))?location.hash.slice(1):'balanced');
</script>
